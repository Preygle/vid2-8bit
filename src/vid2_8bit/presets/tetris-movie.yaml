description: >
  Tetris (2023) film style, fitted against real before/after frame pairs from
  the film (in/real1.png -> in/pixel1.png, in/real2.png -> in/pixel2.png) and
  refined through blind A/B critique against those frames.

  Three findings drove this preset, and all three contradict what looked
  obviously right beforehand:

  1. texture_removal is 0. L0 structure-texture separation destroys the exact
     thing the film preserves - long horizontal balcony runs, facade numbering,
     window grids. The film is not an abstraction of the photo, it is a
     re-quantization of it.
  2. Palette SIZE is not the lever; palette SEPARATION is. Sixteen colours
     0.02 apart in lightness read as one muddy tone. min_separation plus
     anchor_ink builds a real ramp from ink to specular.
  3. Cinematic night footage uses a third of the lightness range. Without the
     tone stage the whole picture sits in the bottom 8% of the scale and no
     downstream setting can recover it.
extends: base

tone:
  enabled: true
  auto_levels: true
  levels_strength: 1.0
  black_point: 1.0
  white_point: 99.0
  gamma: 1.0
  # Two-pole S-curve: ink shadows, lifted highlights, little in between.
  contrast: 0.9
  saturation: 1.2
  # Point `reference` at a style frame to adopt its grade. Left unset here so
  # the preset works on any footage; the CLI/web UI can supply one.
  reference: null
  transfer_strength: 0.0

sample:
  cell_size: null
  # The film sits near 180 logical px wide. Far coarser than it looks.
  target_width: 180
  method: outline_expand
  contrast_weight: 1.0
  expand_radius: 1.0

palette:
  mode: auto
  size: 16
  chroma_weight: 1.3
  # The decisive palette setting - see finding 2 above.
  redistribute: 1.0
  warm_highlights: 0.35
  anchor_ink: true

abstract:
  enabled: true
  texture_removal: 0.0
  smooth_radius_cells: 0.0
  luma_bands: 0
  saturation: 1.0

structure:
  # The film has no dark outlines. Shapes are defined by colour boundaries.
  outlines: false

dither:
  mode: none

temporal:
  enabled: true
  flow: dis
  blend: 0.5
  hysteresis: 0.02
  grid_anchor: true
  decimate_fps: 12.0

output:
  crt: false
